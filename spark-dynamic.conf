# Spark Dynamic Allocation Configuration
spark.dynamicAllocation.enabled=true
spark.dynamicAllocation.minExecutors=2
spark.dynamicAllocation.maxExecutors=8
spark.dynamicAllocation.initialExecutors=3
spark.dynamicAllocation.executorIdleTimeout=60s
spark.dynamicAllocation.schedulerBacklogTimeout=1s
spark.dynamicAllocation.sustainedSchedulerBacklogTimeout=5s
spark.shuffle.service.enabled=true
spark.shuffle.service.port=7337

# Оптимизация памяти
spark.memory.fraction=0.6
spark.memory.storageFraction=0.5
spark.executor.memoryOverhead=512m

# Автоматическое масштабирование
spark.adaptive.enabled=true
spark.adaptive.coalescePartitions.enabled=true
spark.adaptive.coalescePartitions.minPartitionSize=64MB
spark.adaptive.advisoryPartitionSizeInBytes=64MB
spark.adaptive.skewJoin.enabled=true